services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./studystack.db:/app/studystack.db
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
